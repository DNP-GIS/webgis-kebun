<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web GIS Monitoring Kebun – Land Clearing</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css"></head><body>
<header><button id="toggle">☰</button><h1>Web GIS Monitoring Kebun</h1><span class="sub">Land Clearing</span></header>
<aside id="panel">
<h2>Ringkasan</h2><div id="summary"></div>
<h2>Filter</h2>
<label>Code<select id="fCode"><option value="">Semua</option></select></label>
<label>Pengerjaan (Alat)<select id="fPeng"><option value="">Semua</option></select></label>
<label>Operator<select id="fOp"><option value="">Semua</option></select></label>
<label>Tanggal dari<input type="date" id="fFrom"></label>
<label>Tanggal sampai<input type="date" id="fTo"></label>
<button id="reset">Reset Filter</button>
<h2>Luas per Code</h2><div id="perCode"></div>
<h2>Luas per Pengerjaan (Alat)</h2><div id="perPeng"></div>
<h2>Luas per Operator</h2><div id="perOp"></div>
<h2>Luas per Tanggal</h2><div id="perTgl"></div>
</aside><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script></body></html>
